version: 2
updates:
  # GitHub Actions versions are safe to bump independently. One grouped PR a month keeps the noise down
  # (D4, docs/dependency_management.md): minor and patch updates arrive together; a new major version
  # arrives as its own PR so it gets its own review.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
  # Python dependencies are intentionally not enabled as version-update PRs: requirements.txt is pinned
  # and checked against requirements.lock.txt / requirements.lock.sha256, and Dependabot cannot
  # regenerate the lock or its digest, so every bump would fail `regenerate_lock.py --check`. The lock
  # regeneration is scripted now (scripts/regenerate_lock.py); a person bumps pins in one PR with it.
  # Security alerts for the pinned packages stay on in the repository settings and are handled the same way.
