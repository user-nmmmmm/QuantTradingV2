name: Prepare dependency lock
on:
  push:
    branches: ["codex/mail-lock-refresh-20261030"]
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Regenerate the runtime lock with the existing generator
        env:
          PIP_INDEX_URL: https://pypi.org/simple
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          import sys
          excluded = {"curl-cffi", "curl_cffi", "yfinance"}
          lines = Path("requirements.lock.txt").read_text().splitlines()
          constraints = Path(os.environ["RUNNER_TEMP"]) / "runtime-constraints.txt"
          constraints.write_text("\n".join(line for line in lines
              if "==" in line and line.split("==", 1)[0].lower() not in excluded) + "\n")
          os.environ["PIP_CONSTRAINT"] = str(constraints)
          subprocess.run([sys.executable, "scripts/regenerate_lock.py"], check=True)
          subprocess.run([sys.executable, "scripts/regenerate_lock.py", "--check"], check=True)
          result = {"source_sha": os.environ["GITHUB_SHA"], "platform": platform.platform(),
              "python": sys.version, "lock": Path("requirements.lock.txt").read_text(),
              "digest": Path("requirements.lock.sha256").read_text()}
          print("LOCK_RESULT=" + json.dumps(result, ensure_ascii=True))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: linux-python311-runtime-lock
          path: |
            requirements.lock.txt
            requirements.lock.sha256
          retention-days: 7
