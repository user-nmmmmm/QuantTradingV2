name: Backtest automation (offline)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 19 * * 0'

permissions:
  contents: read

jobs:
  synthetic-smoke-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install the project (editable)
        run: python -m pip install -e . --no-deps
      - name: Engine regression and automation boundary tests
        run: python -m pytest -q tests/test_backtest_regression.py tests/test_automation_runner.py
      - name: Fixed synthetic daily bars, full report, manifest replay and verdict
        run: |
          # Health recovery requires three distinct registered symbols.
          python scripts/run_automation.py status
          python main.py --source synthetic --symbols BTC-USDT ETH-USDT SOL-USDT --start 2020-01-01 --end 2020-06-28 --timeframe 1d --seed 42 --capital 100000 --report-profile full --disable-routing-log --output-dir outputs/automation/snapshot-smoke/report
          python -c "from pathlib import Path; from scripts.evaluate_matrix import evaluate_report; from scripts.run_automation import save_json; p=Path('outputs/automation/snapshot-smoke'); save_json(p/'verdict.json', evaluate_report(p/'report', maximum_drawdown=0.20))"
          python main.py --replay-manifest outputs/automation/snapshot-smoke/report/run_manifest.json
      - name: Expose honest operational day count
        if: always()
        run: python scripts/run_automation.py status
      - name: Preserve receipts, logs and synthetic audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-backtest-evidence
          path: outputs/automation/
          retention-days: 30
