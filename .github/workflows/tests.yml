name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies (runtime versions come from the lock)
        run: python -m pip install -r requirements.lock.txt -r requirements-dev.txt
      - name: Install the project (editable)
        run: python -m pip install -e . --no-deps
      - name: Verify environment and lock integrity
        run: python scripts/dev.py env
      - name: Verify frozen research inputs
        run: python scripts/dev.py data
      - name: Architecture inventory matches the code
        run: python scripts/dev.py arch
      - name: Lint
        run: python scripts/dev.py lint
      - name: Quality ratchet (no new ruff/mypy findings; hard-gated mypy modules stay clean)
        run: python scripts/dev.py ratchet
      - name: Check import direction (layers)
        run: python scripts/dev.py imports
      - name: Dashboard frontend tests
        run: python scripts/dev.py frontend
      - name: Type check critical runtime contracts
        run: python scripts/dev.py types
      - name: Check tracked files and frozen artifacts
        run: python scripts/dev.py hygiene
      - name: Verify protected historical archive
        run: python scripts/dev.py archive
      - name: Check Markdown links
        run: python scripts/dev.py links
      - name: Report frozen-scope identity impact (informational)
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/identity_report.py
          --base "origin/${{ github.base_ref }}" --head HEAD
          --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Verify roadmap completion structure
        run: python scripts/dev.py roadmap
      - name: Tests and coverage gate
        # Budget: the suite runs in about 3 minutes with -n 4 (docs/quality.md, "耗时预算"); 8 minutes is the
        # point where something has regressed badly enough to stop the job.
        timeout-minutes: 8
        run: python scripts/dev.py test
      - name: Sandbox suite is discoverable
        run: python scripts/dev.py sandbox

  ml-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install CPU research dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-ml.txt
      - name: Install the project (editable)
        run: python -m pip install -e . --no-deps
      - name: Verify ML research on synthetic inputs
        run: >-
          python -m pytest -q
          tests/test_ml_selection_dataset.py
          tests/test_ml_selection_models.py
          tests/test_ml_selection_environment.py
          tests/test_ml_selection_integrity.py
          tests/test_ml_selection_pipeline.py
          tests/test_ml_selection_next_supervised.py
          tests/test_ml_selection_next_rl.py
          tests/test_ml_selection_next_round.py
          tests/test_ml_selection_next_forward.py
          tests/test_ml_selection_diagnostics.py
          tests/test_ml_selection_batch_comparison.py
          tests/test_ml_selection_bridge_audit.py
          tests/test_ml_selection_stress_failures.py
          tests/test_coin_selector_cli.py
          --junitxml=outputs/ml-research-tests.xml
      - name: Preserve ML test receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ml-research-tests
          path: outputs/ml-research-tests.xml
          retention-days: 30

  install-smoke:
    # Proves a clean clone installs and imports without sys.path tricks, on the
    # platforms contributors actually use. Not a required check yet.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable, resolves pins from requirements.txt)
        run: python -m pip install -e .
      - name: Import the packages from outside the checkout
        working-directory: ${{ runner.temp }}
        run: >-
          python -c "import core, backtest, live_trading, strategies, router, composition,
          analysis, research, config, dashboard, scripts, main, run_live, resolve_live_order;
          print('imports ok')"
      - name: Console entry points start
        working-directory: ${{ runner.temp }}
        run: |
          quant-backtest --help
          quant-live --help
      - name: Identity, data and runtime regressions across Python versions and platforms
        run: |
          python -m pip install pytest==9.1.1
          python -m pytest -q tests/test_source_identity.py tests/test_release_check.py tests/test_data_input_integrity.py tests/test_aud05_runtime_semantics.py tests/test_nonpositive_equity_metrics.py
