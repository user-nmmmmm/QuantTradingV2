name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install the project (editable)
        run: python -m pip install -e . --no-deps
      - name: Verify environment and lock integrity
        run: |
          python scripts/check_environment.py
          python scripts/verify_lock.py
      - name: Lint
        run: python -m ruff check .
      - name: Dashboard frontend tests
        run: node --test tests/dashboard_*.test.mjs
      - name: Verify protected historical archive
        run: python scripts/verify_baseline_archive.py
      - name: Check tracked files and frozen artifacts
        run: python scripts/check_repository_hygiene.py
      - name: Verify roadmap completion structure
        run: python scripts/verify_roadmap_completion.py --structure-only
      - name: Type check critical runtime contracts
        run: python -m mypy core/domain.py core/runtime.py live_trading/execution_adapter.py
      - name: Tests and coverage gate
        run: python -m pytest -q --cov=core --cov=backtest --cov=live_trading --cov-fail-under=55
      - name: Sandbox suite is discoverable
        run: python -m pytest -q tests/test_exchange_sandbox_e2e.py

  ml-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU research dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-ml.txt
      - name: Install the project (editable)
        run: python -m pip install -e . --no-deps
      - name: Verify ML research on synthetic inputs
        run: >-
          python -m pytest -q
          tests/test_ml_selection_dataset.py
          tests/test_ml_selection_models.py
          tests/test_ml_selection_environment.py
          tests/test_ml_selection_integrity.py
          tests/test_ml_selection_pipeline.py
          tests/test_ml_selection_next_supervised.py
          tests/test_ml_selection_next_rl.py
          tests/test_ml_selection_next_round.py
          tests/test_ml_selection_next_forward.py
          tests/test_ml_selection_diagnostics.py
          tests/test_ml_selection_batch_comparison.py
          tests/test_ml_selection_bridge_audit.py
          tests/test_ml_selection_stress_failures.py
          tests/test_coin_selector_cli.py
          --junitxml=outputs/ml-research-tests.xml
      - name: Preserve ML test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-research-tests
          path: outputs/ml-research-tests.xml
          retention-days: 30

  install-smoke:
    # Proves a clean clone installs and imports without sys.path tricks, on the
    # platforms contributors actually use. Not a required check yet.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable, resolves pins from requirements.txt)
        run: python -m pip install -e .
      - name: Import the packages from outside the checkout
        working-directory: ${{ runner.temp }}
        run: >-
          python -c "import core, backtest, live_trading, strategies, router, composition,
          analysis, research, config, dashboard, scripts, main, run_live, resolve_live_order;
          print('imports ok')"
      - name: Console entry points start
        working-directory: ${{ runner.temp }}
        run: |
          quant-backtest --help
          quant-live --help
