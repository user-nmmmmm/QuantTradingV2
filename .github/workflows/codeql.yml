name: codeql

# Static security analysis (infrastructure roadmap D5, docs/adr/0021). Informational: it is not a required
# check, so a finding never blocks a merge by itself; review results under Security -> Code scanning.
on:
  push:
    branches: [main, "codex/pr25-completion-*"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # Mondays, so new queries also run against an unchanged main

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
