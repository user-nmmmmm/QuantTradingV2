[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-trading"
# Release version follows docs/releasing.md; tags and A5 registration are owner operations.
version = "3.1.1"
description = "Quant trading research, backtesting and exchange-connected runtime"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
ml = ["lightgbm==4.7.0", "scikit-learn==1.9.1"]

[project.scripts]
quant-backtest = "main:main"
quant-live = "run_live:main"
quant-resolve-order = "resolve_live_order:main"
quant-dashboard = "dashboard.__main__:main"
quant-dev = "scripts.dev:main"

# Runtime pins stay in requirements.txt (verified against requirements.lock.txt
# by scripts/verify_lock.py); pyproject reads them so there is one source.
[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# Many modules locate config/, data/ and reports/ relative to the checkout, so
# the supported mode is an editable install from a clone: `pip install -e .`.
# Wheels are not a supported distribution format yet.
[tool.setuptools]
py-modules = ["main", "run_live", "resolve_live_order"]

[tool.setuptools.packages.find]
include = ["analysis*", "backtest*", "cli*", "composition*", "config*", "core*", "dashboard*",
           "live_trading*", "ops*", "research*", "router*", "scripts*", "signal_meta*", "strategies*"]
namespaces = true

[tool.setuptools.package-data]
config = ["*.yaml", "*.json", "*.csv", "ml_selector_frozen/*.json"]
dashboard = ["*.js", "*.css", "*.html", "*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["outputs", "reports", ".venv", ".venv-linux"]
addopts = "--strict-markers"
# Hard stop for a hung test (needs pytest-timeout from requirements-dev.txt).
timeout = 600
markers = [
    "slow: test takes roughly 5 s or more; deselect for a quick loop with -m 'not slow'",
    "network: needs a real network connection (none do today; keep new ones opt-in)",
    "quarantine: known-unstable test (reason=, until=YYYY-MM-DD); collection enforces <=10 actual cases and a deadline within 30 UTC days; failures do not block",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", ".venv-linux", "reports", "outputs", "dummy_output"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_unused_ignores = true

# Quality ratchet (scripts/quality_ratchet.py): wider than [tool.ruff.lint] / the mypy gate in CI.
# Existing findings are recorded in scripts/quality_baseline.json and may only decrease.
[tool.quality_ratchet.ruff]
select = ["F", "E4", "E7", "E9", "B"]
# B905 (zip without strict=) is excluded: adding strict=True changes runtime behavior.
ignore = ["B905"]

[tool.quality_ratchet.mypy]
paths = ["core", "ops", "signal_meta", "backtest", "live_trading", "strategies", "router", "composition"]

# Function length (B8, ADR 0026): a function of `limit` lines or more is tolerated only at its recorded length and
# may only get shorter; a new one at or above the limit fails. The value counted is the function's line count.
[tool.quality_ratchet.function_length]
limit = 100
paths = ["core", "ops", "signal_meta", "backtest", "live_trading", "strategies", "router", "composition", "cli", "config",
         "analysis", "research", "dashboard"]

# Import direction (import-linter, run in CI: `lint-imports`). Higher layers may import lower ones,
# never the reverse. Scripts and tests are outside the rule set on purpose (they sit above everything).
[tool.importlinter]
root_packages = [
    "cli", "core", "ops", "signal_meta", "config", "strategies", "router", "composition",
    "backtest", "live_trading", "analysis", "research", "dashboard",
]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Layered architecture (high -> low)"
type = "layers"
layers = [
    "dashboard",
    "cli",
    "research | analysis",
    "backtest | live_trading",
    "composition",
    "router",
    "strategies",
    "config",
    "ops | signal_meta",
    "core",
]
# No exceptions: ``ignore_imports`` must stay absent. tests/test_architecture_boundaries.py pins it, and
# adding one needs an explicit design decision (ADR 0017 cleared the last four).

[[tool.importlinter.contracts]]
name = "core depends on no other project package"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = [
    "ops", "signal_meta", "config", "strategies", "router", "composition",
    "backtest", "live_trading", "analysis", "research", "dashboard",
]

